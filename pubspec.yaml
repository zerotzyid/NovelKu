name: novelku
description: Personalized AI Novel Generator - Flutter novel writing application with AI integration.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1
  http: ^1.1.0
  intl: ^0.18.1
  uuid: ^4.3.0
  file_picker: ^6.1.1
  share_plus: ^7.2.1
  package_info_plus: ^5.0.1
  shared_preferences: ^2.2.2
  path: ^1.8.3
  crypto: ^3.0.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  freezed: ^2.4.6
  json_serializable: ^6.7.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
