pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    def sdkPath = System.getenv('FLUTTER_ROOT')
    if (sdkPath == null) {
        throw new GradleException("FLUTTER_ROOT environment variable must be set. Run 'flutter build' via Flutter tool.")
    }
    includeBuild("$sdkPath/packages/flutter_tools/gradle")
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0" apply false
    id "com.android.application" version "8.1.0" apply false
    id "org.jetbrains.kotlin.android" version "1.8.22" apply false
}

rootProject.name = "NovelKu"
include ":app"
