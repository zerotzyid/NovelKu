include ':app'

def localProperties = new Properties()
def localPropertiesFile = file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}
def flutterRoot = localProperties.getProperty('flutter.sdk')

include "flutter_plugin_android_lifecycle"
project(":flutter_plugin_android_lifecycle").projectDir = new File("$flutterRoot/packages/flutter_plugin_android_lifecycle")

include "shared_preferences_android"
project(":shared_preferences_android").projectDir = new File("$flutterRoot/packages/shared_preferences_android")

include "share_plus"
project(":share_plus").projectDir = new File("$flutterRoot/packages/share_plus/share_plus/android")

include "package_info_plus"
project(":package_info_plus").projectDir = new File("$flutterRoot/packages/package_info_plus/package_info_plus/android")

include "path_provider_android"
project(":path_provider_android").projectDir = new File("$flutterRoot/packages/path_provider_android")
